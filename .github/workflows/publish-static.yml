name: Publish static website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "people.html"
      - "publications.html"
      - "assets/**"
      - ".github/workflows/publish-static.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html people.html publications.html .nojekyll _site/
          cp -R assets _site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
