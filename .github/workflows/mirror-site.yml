name: Mirror and publish xrlinlab.com

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-site.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install HTTrack
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack

      - name: Mirror current website
        run: |
          rm -rf mirror
          mkdir -p mirror
          httrack "https://www.xrlinlab.com/" \
            -O "mirror" \
            "+*.xrlinlab.com/*" \
            "-*/wp-admin/*" \
            "-*/wp-login.php*" \
            "-*/cart/*" \
            "-*/checkout/*" \
            -v

          SOURCE_DIR="mirror/www.xrlinlab.com"
          if [ ! -d "$SOURCE_DIR" ]; then
            SOURCE_DIR="$(find mirror -maxdepth 1 -type d -name '*xrlinlab.com*' | head -n 1)"
          fi

          if [ -z "$SOURCE_DIR" ] || [ ! -d "$SOURCE_DIR" ]; then
            echo "Mirrored site directory not found."
            find mirror -maxdepth 2 -type d -print
            exit 1
          fi

          mkdir -p site
          rsync -a "$SOURCE_DIR/" site/
          touch site/.nojekyll

      - name: Save mirrored files to repository
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="README.md" \
            site/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No website changes detected."
          else
            git commit -m "Mirror xrlinlab.com as static HTML"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
