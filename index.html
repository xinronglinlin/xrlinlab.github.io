<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MolEnergy Lab | Xinrong Lin Research Group">
  <title>MolEnergy Lab</title>
  <link rel="canonical" href="https://xrlinlab.github.io/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{
      --page-width:1200px;
      --title:#222222;
      --nav:#999999;
      --nav-active:#111111;
      --body:#575757;
      --paper:#ffffff;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:var(--paper);
      color:var(--body);
    }

    body{
      font-family:"Proxima Nova","Helvetica Neue",Arial,sans-serif;
      font-size:15px;
      font-weight:300;
      line-height:1.7;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    a{color:inherit;text-decoration:none}

    .site-shell{
      width:var(--page-width);
      max-width:calc(100vw - 48px);
      margin:0 auto;
    }

    /* Centered bilingual lab name above the primary navigation. */
    .site-header{
      padding-top:84px;
    }

    .header-row{
      min-height:52px;
      display:grid;
      grid-template-columns:minmax(0,1fr);
      justify-items:center;
      gap:44px;
      text-align:center;
    }

    .site-identity{
      display:grid;
      justify-items:center;
      gap:5px;
    }

    .site-title{
      margin:0;
      color:var(--title);
      font-family:"Futura PT",Futura,Poppins,"Century Gothic","Avenir Next",Arial,sans-serif;
      font-size:48px;
      line-height:1.2;
      font-weight:700;
      letter-spacing:1px;
      text-transform:none;
      white-space:normal;
      max-width:100%;
    }

    .site-tagline{
      margin:0;
      color:#858585;
      font-family:Georgia,"Times New Roman",serif;
      font-size:17px;
      line-height:1.5;
      font-weight:400;
      font-style:italic;
      letter-spacing:.05px;
    }

    .site-nav{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      gap:30px;
      padding-top:0;
      white-space:nowrap;
    }

    .site-nav a{
      color:var(--nav);
      font-family:"Futura PT",Futura,"Century Gothic","Avenir Next",Arial,sans-serif;
      font-size:18px;
      line-height:1.6em;
      font-weight:400;
      letter-spacing:1px;
      text-transform:uppercase;
      transition:color .15s ease;
    }

    .site-nav a.active,
    .site-nav a:hover{
      color:var(--nav-active);
    }

    /* Preserve the image composition and spacing below the header. */
    .hero{
      position:relative;
      min-height:820px;
      margin-top:89px;
    }

    figure{
      margin:0;
    }

    .hero-primary{
      width:583px;
      margin-left:120px;
    }

    .hero-primary img{
      display:block;
      width:583px;
      height:583px;
      object-fit:cover;
      object-position:center;
    }

    .hero-secondary{
      position:absolute;
      width:420px;
      top:304px;
      right:40px;
    }

    .hero-secondary img{
      display:block;
      width:420px;
      height:280px;
      object-fit:cover;
      object-position:center;
    }

    figcaption{
      margin-top:8px;
      color:var(--body);
      font-family:"Proxima Nova","Helvetica Neue",Arial,sans-serif;
      font-size:12px;
      line-height:20.16px;
      font-weight:300;
      letter-spacing:0;
    }

    .home-space{
      height:230px;
    }

    .site-footer{
      padding:0 0 54px;
      color:var(--body);
      font-family:"Proxima Nova","Helvetica Neue",Arial,sans-serif;
      font-size:12px;
      line-height:20px;
      font-weight:300;
    }

    .footer-row{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
    }

    @media (max-width:1248px){
      .site-shell{
        width:auto;
        max-width:none;
        margin-left:24px;
        margin-right:24px;
      }

      .header-row{
        grid-template-columns:1fr;
        gap:44px;
      }

      .site-nav{
        justify-content:center;
        flex-wrap:wrap;
        gap:18px 24px;
        padding-top:0;
      }

      .hero{
        min-height:auto;
      }

      .hero-primary{
        width:min(583px,72vw);
        margin-left:0;
      }

      .hero-primary img{
        width:100%;
        height:auto;
        aspect-ratio:1/1;
      }

      .hero-secondary{
        position:relative;
        top:auto;
        right:auto;
        width:min(420px,60vw);
        margin:58px 0 0 auto;
      }

      .hero-secondary img{
        width:100%;
        height:auto;
        aspect-ratio:3/2;
      }
    }

    @media (max-width:700px){
      .site-header{padding-top:42px}
      .site-title{font-size:32px}
      .site-tagline{font-size:15px}
      .site-nav a{font-size:14px}
      .hero{margin-top:62px}
      .hero-primary{width:100%}
      .hero-secondary{width:78%}
      .home-space{height:140px}
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="site-shell header-row">
      <div class="site-identity">
        <a class="site-title" href="index.html">Molecular Energy Lab</a>
        <p class="site-tagline">Designing organic molecular materials for advanced energy technologies</p>
      </div>

      <nav class="site-nav" aria-label="Primary navigation">
        <a class="active" href="index.html">Home</a>
        <a href="research.html">Research</a>
        <a href="xinrong-lin.html">Xinrong Lin</a>
        <a href="people.html">People</a>
        <a href="publications.html">Publications</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="site-shell">
    <section class="hero" aria-label="MolEnergy Lab in Shanghai">
      <figure class="hero-primary">
        <img src="assets/images/home-sioc-watercolor.webp" alt="Watercolor illustration of Shanghai Institute of Organic Chemistry">
        <figcaption>Shanghai Institute of Organic Chemistry</figcaption>
      </figure>

      <figure class="hero-secondary">
        <img src="assets/images/home-shanghai-watercolor.webp" alt="Watercolor illustration of the Shanghai skyline and Oriental Pearl Tower">
        <figcaption>Shanghai, China</figcaption>
      </figure>
    </section>

    <div class="home-space" aria-hidden="true"></div>
  </main>

  <footer class="site-footer">
    <div class="site-shell footer-row">
      <span>MolEnergy Lab</span>
      <span>Shanghai Institute of Organic Chemistry, CAS</span>
    </div>
  </footer>
</body>
</html>
